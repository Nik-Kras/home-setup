# 1. Sign in, wrong password, sign out, session survives an app restart.
# Sign out uses the Sign out row at the end of the Home tab. Nothing is queued at that point, so it
# signs out without the "not sent yet" question.
appId: app.homesetup.household
name: 01 auth
---
# Start signed out.
- clearState
- runFlow: common/open.yaml
- assertVisible: "Sign in to see the shared list"

# Wrong password: an error, still on the sign-in screen.
- tapOn: "Email"
- inputText:
    text: ${E2E_EMAIL}
    label: "Type the test account email"
- tapOn: "Password"
- inputText: "ZZ-e2e-wrong-password"
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Invalid login credentials"
    timeout: 15000
- assertVisible: "Sign in to see the shared list"

# Right password.
- tapOn: "Password"
- eraseText: 40
- inputText:
    text: ${E2E_PASSWORD}
    label: "Type the test account password"
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Add an item"
    timeout: 30000
- assertNotVisible: "Sign in to see the shared list"

# Session survives a cold restart.
- runFlow: common/open.yaml
- extendedWaitUntil:
    visible: "Add an item"
    timeout: 30000
- assertNotVisible: "Sign in to see the shared list"

# Sign out from the Home tab: the sign-in screen is back, and stays back after a restart.
- tapOn: "Home"
- scrollUntilVisible:
    element:
      id: "sign-out"
    centerElement: true
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "sync-status"
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign in to see the shared list"
    timeout: 15000
- runFlow: common/open.yaml
- assertVisible: "Sign in to see the shared list"

# Leave the app signed in for the next flows.
- runFlow: common/signin.yaml
