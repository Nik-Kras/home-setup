# 8. Home-screen widget, app not running: tap the circle to mark an item got (handled in the
# background), and tap + to open the app on the add field.
# Needs a large Our flat widget on a home page (run.sh runs place-widget.sh first).
appId: app.homesetup.household
name: 08 widget
---
- runFlow: common/open.yaml
- runFlow: common/signin.yaml
- runFlow:
    file: common/add-item.yaml
    env: { NAME: ZZ-e2e-widget }
- runFlow:
    file: common/db.yaml
    env: { OP: expect-item, NAME: ZZ-e2e-widget, FIELDS: "status=needed" }

# Prime the widget: after clearState (flows 01 and 09) its first tap only measures the widget size and is
# dropped (react-native-android-widget, RNWidgetSizing.correct). Tap a spare row: dropped, or it is marked got.
- runFlow:   # added in the app, so the widget has it before Home (a row added through the database did not show in time)
    file: common/add-item.yaml
    env: { NAME: ZZ-e2e-widget-prime }
- runFlow:
    file: common/goto-widget.yaml
    env: { TARGET: "Mark ZZ-e2e-widget-prime as got" }
- tapOn: "Mark ZZ-e2e-widget-prime as got"

# Tap to got with the app closed: Home, then the process is killed the way Android kills a background app
# (killApp is `am kill`). Not stopApp: that is `am force-stop`, which also cancels the widget's tap intents,
# so taps do nothing until the app runs again (Android behaviour, same as "Force stop" in Settings).
- pressKey: Home
- extendedWaitUntil:   # a few seconds in the background first, or `am kill` leaves the process alone
    visible: "ZZ-never-shown"
    timeout: 5000
    optional: true
- killApp
- runFlow:
    file: common/goto-widget.yaml
    env: { TARGET: "Mark ZZ-e2e-widget as got" }
- tapOn: "Mark ZZ-e2e-widget as got"
- runFlow:
    file: common/db.yaml
    env: { OP: expect-item, NAME: ZZ-e2e-widget, FIELDS: "status=delivered,delivered_at=notnull", TIMEOUT: "45" }
- extendedWaitUntil:
    notVisible: "Mark ZZ-e2e-widget as got"
    timeout: 30000

# Tap to add: + opens the app on the Buy list with the add field focused.
- tapOn: "Add an item"
- extendedWaitUntil:
    visible:
      text: "Add an item"
      focused: true
    timeout: 90000
- inputText: "ZZ-e2e-widget-add"
- pressKey: Enter
- extendedWaitUntil:
    visible: "ZZ-e2e-widget-add, .*"
    timeout: 5000
- runFlow:
    file: common/db.yaml
    env: { OP: expect-item, NAME: ZZ-e2e-widget-add, FIELDS: "status=needed" }

# Mark the spare rows got so they leave the widget: it shows four rows, and 08b needs room for its own.
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget-prime, FIELDS: "status=delivered" }
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget-add, FIELDS: "status=delivered" }
