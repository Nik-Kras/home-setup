# 8. Home-screen widget, app not running: tap the circle to move an item one stage on (handled in the
# background; a needed item goes to looking and stays on the widget), and tap + to open the app's add
# screen with its field focused. The circle's label names the stage: "Mark looking: <name>", "Mark ordered", "Got it".
# Needs a large Our flat widget on a home page (run.sh runs place-widget.sh first).
appId: app.homesetup.household
name: 08 widget
---
- runFlow: common/open.yaml
- runFlow: common/signin.yaml
- runFlow:
    file: common/add-item.yaml
    env: { NAME: ZZ-e2e-widget }
- runFlow:
    file: common/db.yaml
    env: { OP: expect-item, NAME: ZZ-e2e-widget, FIELDS: "status=needed" }

# Prime the widget: after clearState (flows 01 and 09) its first tap only measures the widget size and is
# dropped (react-native-android-widget, RNWidgetSizing.correct). Tap a spare row: dropped, or it moves to looking.
- runFlow:   # added in the app, so the widget has it before Home (a row added through the database did not show in time)
    file: common/add-item.yaml
    env: { NAME: ZZ-e2e-widget-prime }
# The large widget shows four rows, urgent first; marked urgent (as the other phone) so the test rows are
# among them whatever else is on the list. The open app redraws the widget when the change arrives.
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget, FIELDS: "urgent=true" }
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget-prime, FIELDS: "urgent=true" }
- runFlow:   # the app has the change (urgent rows move up their room)
    file: common/find-on-buy.yaml
    env: { TARGET: "ZZ-e2e-widget-prime, Urgent.*" }
- runFlow:
    file: common/goto-widget.yaml
    env: { TARGET: "Mark looking: ZZ-e2e-widget-prime" }
- tapOn: "Mark looking: ZZ-e2e-widget-prime"

# One stage on with the app closed: Home, then the process is killed the way Android kills a background app
# (killApp is `am kill`). Not stopApp: that is `am force-stop`, which also cancels the widget's tap intents,
# so taps do nothing until the app runs again (Android behaviour, same as "Force stop" in Settings).
- pressKey: Home
- extendedWaitUntil:   # a few seconds in the background first, or `am kill` leaves the process alone
    visible: "ZZ-never-shown"
    timeout: 5000
    optional: true
- killApp
- runFlow:
    file: common/goto-widget.yaml
    env: { TARGET: "Mark looking: ZZ-e2e-widget" }
- tapOn: "Mark looking: ZZ-e2e-widget"
- runFlow:
    file: common/db.yaml
    env: { OP: expect-item, NAME: ZZ-e2e-widget, FIELDS: "status=looking,delivered_at=null", TIMEOUT: "45" }
# Still on the widget, now offering the next stage.
- extendedWaitUntil:
    visible: "Mark ordered: ZZ-e2e-widget"
    timeout: 30000

# Tap to add: + opens the add screen (Item side) with its field focused; Enter adds the item and closes
# it onto the Buy list, where the new row shows (labelled "<name>, <owner>").
- tapOn: "Add an item"
- extendedWaitUntil:
    visible:
      text: "Add an item"
      focused: true
    timeout: 90000
- inputText: "ZZ-e2e-widget-add"
- pressKey: Enter
- scrollUntilVisible:
    element: "ZZ-e2e-widget-add, .*"
    timeout: 15000
    waitToSettleTimeoutMs: 500
- runFlow:
    file: common/db.yaml
    env: { OP: expect-item, NAME: ZZ-e2e-widget-add, FIELDS: "status=needed" }

# Mark the test rows got so they leave the widget: it shows four rows, and 08b needs room for its own.
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget, FIELDS: "status=delivered" }
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget-prime, FIELDS: "status=delivered" }
- runFlow:
    file: common/db.yaml
    env: { OP: set-item, NAME: ZZ-e2e-widget-add, FIELDS: "status=delivered" }
