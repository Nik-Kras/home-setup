# Opens Flat notes from the chip on the Tasks screen (under the Mine / Daryna / Both switch).
appId: app.homesetup.household
---
- tapOn: "Tasks"
- scrollUntilVisible:
    element: "Flat notes.*"
    centerElement: true
    waitToSettleTimeoutMs: 500
- tapOn: "Flat notes.*"
- extendedWaitUntil:
    visible: "Facts about the flat.*"
    timeout: 5000
