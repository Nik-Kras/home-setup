# Used by place-widget.sh: opens the Pixel launcher's widget picker at "Our flat · large".
# Maestro has no long-press-and-drag, so the script does the drop itself with adb.
appId: com.google.android.apps.nexuslauncher
---
- pressKey: Home
- longPressOn:
    point: 50%, 73%
- tapOn: "Widgets"
- scrollUntilVisible:
    element: "Home Setup"
- tapOn: "Home Setup"
- scrollUntilVisible:
    element: "Our flat · large widget.*"
    centerElement: true
